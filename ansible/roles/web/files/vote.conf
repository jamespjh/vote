# Live audience poll: https://research.jh.arc.ucl.ac.uk/vote
# One daemon process with threads, so all requests share one SQLite connection and lock.
WSGIDaemonProcess vote processes=1 threads=32 display-name=%{GROUP}
WSGIScriptAlias /vote /var/www/builds/vote/app/vote.py process-group=vote application-group=%{GLOBAL}

<Location "/vote">
    SetEnv VOTE_DB /var/www/vote-data/vote.sqlite
</Location>

<Directory "/var/www/builds/vote/app">
    Require all granted
    Options -Indexes
    AllowOverride None
</Directory>
