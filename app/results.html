<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live results</title>
<style>
  :root {
    --ink: #FFFFFF; --bg: #361A54; --bg2: #1F0A33;
    --yes: #34C6C6; --no: #9A3BFF; --mid: #BA82FF; --faint: rgba(255,255,255,.14);
    --font: "UCL Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --u: min(1vw, 1.78vh);  /* scales with a 16:9 box, whatever size the iframe is */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font); color: var(--ink);
    background: radial-gradient(90% 120% at 15% 0%, #522880 0%, var(--bg) 40%, var(--bg2) 100%);
    display: grid; grid-template-columns: 1fr calc(28 * var(--u)); grid-template-rows: auto auto 1fr auto;
    gap: calc(2.2 * var(--u)) calc(4 * var(--u)); padding: calc(2.5 * var(--u)) calc(4 * var(--u));
  }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: calc(2 * var(--u)); }
  .brand { font-weight: 700; letter-spacing: .3em; font-size: calc(1.6 * var(--u)); color: var(--mid); }
  .live { display: inline-flex; align-items: center; gap: .5em; font-size: calc(1.4 * var(--u)); font-weight: 700; letter-spacing: .2em; color: var(--yes); }
  .live::before { content: ""; width: .7em; height: .7em; border-radius: 50%; background: var(--yes); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 { grid-column: 1 / -1; font-size: calc(6.2 * var(--u)); line-height: 1; font-weight: 700; letter-spacing: -0.025em; margin-top: calc(-1 * var(--u)); }
  .bars { grid-column: 1; display: flex; flex-direction: column; justify-content: center; gap: calc(2.5 * var(--u)); min-height: 0; }
  .row { display: grid; grid-template-columns: calc(11 * var(--u)) 1fr calc(14 * var(--u)); align-items: center; gap: calc(2 * var(--u)); }
  .label { font-size: calc(5 * var(--u)); font-weight: 700; }
  .track { height: calc(7.5 * var(--u)); background: var(--faint); border-radius: calc(1.2 * var(--u)); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: inherit; transition: width .8s cubic-bezier(.2,.9,.2,1); }
  #yes .fill { background: linear-gradient(90deg, #1F8A8A, var(--yes)); box-shadow: 0 0 calc(4 * var(--u)) rgba(52,198,198,.45); }
  #no .fill { background: linear-gradient(90deg, #6C29B2, var(--no)); box-shadow: 0 0 calc(4 * var(--u)) rgba(154,59,255,.45); }
  .count { text-align: right; font-variant-numeric: tabular-nums; }
  .count b { display: block; font-size: calc(6 * var(--u)); line-height: 1; }
  .count span { font-size: calc(2 * var(--u)); color: rgba(255,255,255,.75); }
  aside { display: flex; flex-direction: column; align-items: center; gap: calc(1 * var(--u)); align-self: end; }
  #qr { background: #fff; padding: calc(1 * var(--u)); border-radius: calc(1 * var(--u)); line-height: 0; }
  #qr svg, #qr img { width: calc(16 * var(--u)); height: calc(16 * var(--u)); }
  .url { font-size: calc(1.7 * var(--u)); font-weight: 700; text-align: center; }
  .url small { display: block; font-weight: 400; color: rgba(255,255,255,.7); font-size: .85em; }
  .timeline { grid-row: 4 / 5; grid-column: 1; align-self: end; }
  .timeline h2 { font-size: calc(1.4 * var(--u)); letter-spacing: .2em; color: rgba(255,255,255,.7); font-weight: 700; margin-bottom: calc(.8 * var(--u)); }
  #chart { width: 100%; height: calc(12 * var(--u)); display: block; }
  #chart .axis { stroke: var(--faint); stroke-width: 1; }
  #chart text { fill: rgba(255,255,255,.6); font-size: 12px; font-family: var(--font); }
  .side { grid-row: 3 / 5; grid-column: 2; display: flex; flex-direction: column; gap: calc(1.5 * var(--u)); min-height: 0; }
  #comments { flex: 1; justify-content: flex-start; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: calc(1 * var(--u)); pointer-events: none; z-index: 5; }
  .bubble { background: #fff; color: var(--bg2); font-size: calc(1.9 * var(--u)); font-weight: 600; line-height: 1.25; padding: calc(1.2 * var(--u)) calc(1.6 * var(--u)); border-radius: calc(1.4 * var(--u)) calc(1.4 * var(--u)) calc(.3 * var(--u)) calc(1.4 * var(--u)); box-shadow: 0 calc(1 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.35); border-left: calc(.5 * var(--u)) solid var(--yes); animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; overflow-wrap: anywhere; }
  .bubble.out { animation: fade .6s ease forwards; }
  @keyframes pop { from { opacity: 0; transform: translateY(calc(-2 * var(--u))) scale(.85); } }
  @keyframes fade { to { opacity: 0; transform: translateX(calc(4 * var(--u))); } }
</style>
</head>
<body>
  <header><span class="brand">UCL</span><span class="live">LIVE</span><span class="live" style="color:#fff;margin-left:auto" id="total">0 votes</span></header>
  <h1>{{QUESTION}}</h1>
  <section class="bars" aria-live="polite">
    <div class="row" id="yes"><div class="label">Yes</div><div class="track"><div class="fill"></div></div><div class="count"><b>0</b><span>0%</span></div></div>
    <div class="row" id="no"><div class="label">No</div><div class="track"><div class="fill"></div></div><div class="count"><b>0</b><span>0%</span></div></div>
  </section>
  <section class="timeline">
    <h2>OVER TIME</h2>
    <svg id="chart" preserveAspectRatio="none" viewBox="0 0 1000 170" aria-label="Running totals over time"></svg>
  </section>
  <div class="side">
    <div id="comments" aria-live="polite"></div>
    <aside>
      <div id="qr"></div>
      <div class="url" id="url"></div>
    </aside>
  </div>
<script src="{{BASE}}/qrcode.js"></script>
<script>
  const BASE = "{{BASE}}";
  const voteUrl = location.origin + BASE;
  document.getElementById("url").innerHTML = "<small>Vote on your phone</small>" + voteUrl.replace(/^https?:\/\//, "");
  try {
    const qr = qrcode(0, "M"); qr.addData(voteUrl); qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({cellSize: 8, margin: 0, scalable: true});
  } catch (e) {}

  function setRow(id, n, total) {
    const row = document.getElementById(id), pct = total ? Math.round(100 * n / total) : 0;
    row.querySelector(".fill").style.width = (total ? 100 * n / total : 0) + "%";
    row.querySelector("b").textContent = n;
    row.querySelector("span").textContent = pct + "%";
  }
  function drawChart(timeline, now) {
    const svg = document.getElementById("chart"), W = 1000, H = 170, pad = 6;
    if (!timeline.length) { svg.innerHTML = `<line class="axis" x1="0" y1="${H-1}" x2="${W}" y2="${H-1}"/><text x="0" y="${H/2}">Waiting for the first vote…</text>`; return; }
    const pts = timeline.concat([[Math.max(now, timeline[timeline.length-1][0]), timeline[timeline.length-1][1], timeline[timeline.length-1][2]]]);
    const t0 = pts[0][0], t1 = Math.max(pts[pts.length-1][0], t0 + 1);
    const max = Math.max(1, ...pts.map(p => Math.max(p[1], p[2])));
    const x = t => (W * (t - t0) / (t1 - t0)), y = v => H - pad - (H - 2 * pad) * v / max;
    const path = i => pts.map((p, k) => (k ? `L${x(p[0]).toFixed(1)},${y(k ? pts[k-1][i] : p[i]).toFixed(1)} ` : "") + `${k ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[i]).toFixed(1)}`).join(" ");
    svg.innerHTML = `<line class="axis" x1="0" y1="${H-1}" x2="${W}" y2="${H-1}"/>` +
      `<path d="${path(1)}" fill="none" stroke="#34C6C6" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>` +
      `<path d="${path(2)}" fill="none" stroke="#9A3BFF" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  }
  // Comments pop up as speech bubbles; at most 4 on screen, each stays 20 seconds.
  let lastComment = null;
  function showComments(list) {
    if (lastComment === null) { lastComment = list.length ? list[list.length - 1].id : 0; list = list.slice(-2); }
    else list = list.filter(c => c.id > lastComment);
    const box = document.getElementById("comments");
    for (const c of list) {
      lastComment = Math.max(lastComment, c.id);
      const el = document.createElement("div");
      el.className = "bubble"; el.textContent = c.text;
      if (c.id % 2) el.style.borderLeftColor = "#9A3BFF";
      box.prepend(el);
      setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 700); }, 20000);
    }
    while (box.children.length > 4 || (box.children.length > 1 && box.scrollHeight > box.clientHeight)) box.lastChild.remove();
  }
  async function tick() {
    try {
      const d = await (await fetch(BASE + "/api/results", {cache: "no-store"})).json();
      const total = d.yes + d.no;
      setRow("yes", d.yes, total); setRow("no", d.no, total);
      document.getElementById("total").textContent = total + (total === 1 ? " vote" : " votes");
      drawChart(d.timeline, d.now);
      showComments(d.comments || []);
    } catch (e) {}
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
