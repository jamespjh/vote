<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#361A54">
<title>Vote</title>
<style>
  :root {
    --ink: #FFFFFF; --bg: #361A54; --bg2: #2C0442;
    --yes: #34C6C6; --no: #9A3BFF; --mid: #BA82FF;
    --font: "UCL Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); color: var(--ink);
    background: radial-gradient(120% 80% at 50% 0%, #522880 0%, var(--bg) 45%, var(--bg2) 100%);
    display: flex; flex-direction: column; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  .brand { font-weight: 700; letter-spacing: .3em; font-size: 14px; color: var(--mid); }
  h1 { font-size: clamp(32px, 10vw, 56px); line-height: 1.05; font-weight: 700; margin: 16px 0 28px; letter-spacing: -0.02em; }
  .choices { display: grid; gap: 16px; flex: 1; grid-template-rows: 1fr 1fr; max-height: 440px; }
  button {
    font: inherit; font-size: clamp(40px, 14vw, 72px); font-weight: 700; color: var(--bg2);
    border: 4px solid transparent; border-radius: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
    transition: transform .12s ease, opacity .2s ease, box-shadow .2s ease;
  }
  button .tick { font-size: .6em; opacity: 0; transition: opacity .2s; }
  button:active { transform: scale(.97); }
  #yes { background: var(--yes); }
  #no { background: var(--no); color: #fff; }
  body.voted .choices button { opacity: .35; }
  body.voted .choices button.chosen { opacity: 1; border-color: #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.15); }
  body.voted .choices button.chosen .tick { opacity: 1; }
  button:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
  form { display: flex; gap: 8px; margin-top: 24px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 14px 16px; border-radius: 14px; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; }
  input::placeholder { color: rgba(255,255,255,.6); }
  input:focus { outline: none; border-color: var(--yes); }
  form button { font-size: 18px; padding: 0 20px; border-radius: 14px; background: #fff; color: var(--bg2); opacity: 1 !important; border: 0; box-shadow: none !important; }
  #cstatus { margin-top: 8px; font-size: 15px; min-height: 1.3em; color: rgba(255,255,255,.75); }
  #status { margin-top: 20px; font-size: 18px; min-height: 1.4em; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
  <div class="brand">UCL</div>
  <h1>{{QUESTION}}</h1>
  <div class="choices">
    <button id="yes" data-choice="yes"><span>Yes</span><span class="tick">&#10003;</span></button>
    <button id="no" data-choice="no"><span>No</span><span class="tick">&#10003;</span></button>
  </div>
  <p id="status" role="status" aria-live="polite">Tap to vote.</p>
  <form id="comment" autocomplete="off">
    <input id="text" maxlength="140" placeholder="Say something to the screen…" aria-label="Comment for the results screen">
    <button type="submit" class="send">Send</button>
  </form>
  <p id="cstatus" role="status" aria-live="polite"></p>
<script>
  const BASE = "{{BASE}}";
  const status = document.getElementById("status");
  function show(choice) {
    document.body.classList.toggle("voted", !!choice);
    for (const b of document.querySelectorAll(".choices button")) {
      b.classList.toggle("chosen", b.dataset.choice === choice);
      b.setAttribute("aria-pressed", b.dataset.choice === choice);
    }
    status.textContent = choice ? "Thanks! You voted " + (choice === "yes" ? "Yes" : "No") + ". Tap the other to change your mind." : "Tap to vote.";
  }
  async function vote(choice) {
    show(choice);
    try {
      const r = await fetch(BASE + "/api/vote", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({choice}), credentials: "same-origin"});
      if (!r.ok) throw new Error(r.status);
    } catch (e) { status.textContent = "Couldn’t send that, please tap again."; }
  }
  const form = document.getElementById("comment"), text = document.getElementById("text"), cstatus = document.getElementById("cstatus");
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    if (!text.value.trim()) return;
    try {
      const r = await fetch(BASE + "/api/comment", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: text.value}), credentials: "same-origin"});
      const d = await r.json();
      if (r.ok) { text.value = ""; cstatus.textContent = "Sent to the screen."; } else cstatus.textContent = d.error || "Couldn’t send that.";
    } catch (e) { cstatus.textContent = "Couldn’t send that, please try again."; }
  });
  for (const b of document.querySelectorAll(".choices button")) b.addEventListener("click", () => vote(b.dataset.choice));
  fetch(BASE + "/api/me", {credentials: "same-origin"}).then(r => r.json()).then(d => show(d.choice)).catch(() => {});
</script>
</body>
</html>
